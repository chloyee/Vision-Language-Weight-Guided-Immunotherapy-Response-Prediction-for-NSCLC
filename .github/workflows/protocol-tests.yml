name: VGMS training checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.4'
      - name: Install dependencies
        run: |
          python -m pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check syntax and configuration
        run: |
          python -m compileall -q .
          python verify_paper_protocol.py
      - name: Check tracked source and credential history
        run: python privacy_scan.py . --history
      - name: Test model and preprocessing
        run: |
          python smoke_test.py
          python -m unittest -v test_safe_spiral test_stain_scaling
          python train_vgms.py --help
          python select_alignment_lambda.py --dry_run
