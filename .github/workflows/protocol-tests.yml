name: Protocol and spiral matching tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.23,<2' 'pandas>=2,<3' 'scikit-learn>=1.3,<2' 'opencv-python-headless>=4.8,<4.12' 'Pillow>=10,<12' 'tqdm>=4.66,<5' openpyxl
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Verify paper protocol defaults
        run: python verify_paper_protocol.py
      - name: Test spiral matching and model forward/backward
        run: python smoke_test.py
